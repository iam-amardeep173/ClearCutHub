<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearCutHub - Image Resize</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/image_resize.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo">
    <img src="static/images/logo.png" alt="ClearCut Logo" class="website-logo">
    ClearCutHub
  </div>
  <ul class="nav-links" id="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/background-remove">Background Change</a></li>
    <li><a href="/resize-image">Image Resize</a></li>
        <li><a href="/#all-tools">All Convert Tools</a></li>
        <li><a href="/#Contact">Contact</a></li>
  </ul>
  <!-- Hamburger Menu -->
  <div class="menu-toggle" id="mobile-menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</nav>

<!-- Upload Section -->
<section id="upload" class="bg-white mx-auto mt-10 max-w-2xl p-6 rounded shadow">
  <h2 class="text-2xl font-bold text-indigo-600 mb-6 text-center">Resize Your Image</h2>
  
  <form id="uploadForm" enctype="multipart/form-data" method="POST" action="/resize">
    <!-- Image Upload -->
    <input type="file" name="file" required class="block w-full border border-gray-300 p-3 mb-4 rounded">

    <!-- Width -->
    <label class="block text-gray-700 mb-2">Width:</label>
    <input type="number" name="width" required class="block w-full border border-gray-300 p-3 mb-4 rounded">

    <!-- Height -->
    <label class="block text-gray-700 mb-2">Height:</label>
    <input type="number" name="height" required class="block w-full border border-gray-300 p-3 mb-4 rounded">

    <!-- Resize Unit -->
    <label class="block text-gray-700 mb-2">Unit:</label>
    <select name="unit" required class="block w-full border border-gray-300 p-3 mb-4 rounded">
      <option value="px">Pixels (px)</option>
      <option value="cm">Centimeters (cm)</option>
      <option value="in">Inches (in)</option>
    </select>

    <!-- Submit -->
    <button type="submit" class="bg-indigo-600 w-full py-3 text-white font-bold rounded hover:bg-indigo-700">
      Upload and Resize Image
    </button>

    <!-- Spinner -->
    <div id="spinner" class="flex justify-center mt-4 hidden">
      <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
    </div>
  </form>

  <!-- Result -->
  <div id="resultContainer" class="mt-8 hidden text-center">
    <h2 class="text-2xl font-semibold mb-4">Resized Image:</h2>
    <img id="resultImage" class="mx-auto rounded shadow-md max-w-[300px] max-h-[300px] object-contain" />
    <a id="downloadLink" download="resized-image.jpg" class="block mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
      Download Resized Image
    </a>
  </div>
</section>

<!-- Footer Section -->

<!-- External JS -->
<script src="{{ url_for('static', filename='js/image_resize.js') }}"></script>

<script>
  const uploadForm = document.getElementById('uploadForm');
  const resultContainer = document.getElementById('resultContainer');
  const resultImage = document.getElementById('resultImage');
  const downloadLink = document.getElementById('downloadLink');

  uploadForm.addEventListener('submit', function(event) {
    event.preventDefault();

    const formData = new FormData(uploadForm);
    document.getElementById('spinner').classList.remove('hidden');

    fetch('/resize', {
      method: 'POST',
      body: formData
    })
    .then(response => response.blob())
    .then(resizedImage => {
      const resizedImageUrl = URL.createObjectURL(resizedImage);
      resultImage.src = resizedImageUrl;
      downloadLink.href = resizedImageUrl;
      resultContainer.classList.remove('hidden');
      document.getElementById('spinner').classList.add('hidden');
    })
    .catch(error => {
      console.error('Error:', error);
      document.getElementById('spinner').classList.add('hidden');
    });
  });
  const menuToggle = document.getElementById('mobile-menu');
const navLinks = document.getElementById('nav-links');

menuToggle.addEventListener('click', () => {
  navLinks.classList.toggle('active');  // You need to define `.active` in CSS to show/hide nav-links
});
</script>

</body>
</html>
