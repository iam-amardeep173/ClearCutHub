<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearCutHub - PDF ⇄ PowerPoint Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pdf_ppt_convert.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ClearCut Logo" class="website-logo">
    ClearCutHub
  </div>
  <ul class="nav-links" id="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/background-remove">Background Change</a></li>
    <li><a href="/resize-image">Image Resize</a></li>
    <li><a href="/#all-tools">All Convert Tools</a></li>
    <li><a href="/#Contact">Contact</a></li>
  </ul>
  <div class="menu-toggle" id="menuToggle">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</nav>

<!-- Converter Section -->
<section id="convert" class="max-w-3xl mx-auto px-6 py-12">
    <h2 class="text-3xl font-semibold text-center text-indigo-600 mb-8">PDF ⇄ PowerPoint Converter</h2>

    <!-- Conversion Form -->
    <form id="convertForm" action="/pdf-ppt-converter/convert" method="POST" enctype="multipart/form-data"  class="bg-white shadow-md rounded-lg p-6 space-y-6">
        <!-- Conversion Type Dropdown -->
        <div>
            <label for="conversion_type" class="block mb-2 text-gray-700 font-medium">Choose Conversion Type:</label>
            <select name="convertType" id="convertType" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">-- Select --</option>
                <option value="pdf-to-ppt">PDF to PowerPoint</option>
                <option value="ppt-to-pdf">PowerPoint to PDF</option>
            </select>
        </div>

        <!-- File Upload -->
        <div>
            <label for="file_input" class="block mb-2 text-gray-700 font-medium">Upload File:</label>
            <input type="file" id="file_input" name="file" required accept=".pdf,.ppt,.pptx" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-md hover:bg-indigo-700 transition">
            Convert Now
        </button>

        <!-- Loading Spinner -->
        <div id="spinner" class="flex justify-center mt-4 hidden">
            <svg class="animate-spin h-6 w-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
        </div>
    </form>

    <!-- Download Section -->
    <div id="downloadSection" class="hidden mt-6 text-center">
        <h3 class="text-green-600 text-xl font-semibold mb-2">✅ Conversion Successful!</h3>
        <a id="downloadLink" href="#" download class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md shadow inline-block">
            Download Converted File
        </a>
    </div>
</section>

<!-- Footer -->


<!-- Navigation Toggle JS -->
<script>
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('nav-links');

  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });
</script>

<!-- External JS -->
<script src="{{ url_for('static', filename='js/pdf_ppt_convert.js') }}"></script>
</body>
</html>
