<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClearCutHub - Add Blank Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
<!-- Bootstrap JS (for collapse to work) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/add_blank_page.css') }}" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ClearCut Logo" class="website-logo" />
      ClearCutHub
    </div>
    <ul class="nav-links" id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/background-remove">Background Change</a></li>
      <li><a href="/resize-image">Image Resize</a></li>
      <li><a href="/#all-tools">All Convert Tools</a></li>
      <li><a href="/#Contact">Contact</a></li>
    </ul>

    <!-- Hamburger icon -->
    <div class="menu-toggle" id="menuToggle">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
  </nav>

  <!-- Add Blank Page Section -->
  <section
    id="add-blank"
    class="bg-white mx-auto mt-10 max-w-6xl p-6 rounded shadow"
  >
    <h2 class="text-2xl font-bold text-indigo-600 mb-6 text-center">
      Add Blank Pages to PDF
    </h2>

    <!-- File Upload -->
    <div class="mb-6 text-center">
      <input
        type="file"
        id="pdfInput"
        accept=".pdf"
        class="block mx-auto w-full max-w-sm border border-gray-300 p-3 rounded mb-2"
      />
      <button
        id="previewButton"
        class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700"
      >
        Preview & Rearrange Pages
      </button>
    </div>

    <!-- Preview Grid -->
    <div
      id="previewContainer"
      class="grid grid-cols-2 md:grid-cols-4 gap-4 px-4 min-h-[200px] border-2 border-dashed border-gray-300 rounded p-4"
    >
      <!-- Page thumbnails and draggable placeholders will be inserted here -->
    </div>

    <!-- Add Blank Button -->
    <div class="text-center mt-6">
      <button
        id="addBlankPageButton"
        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700"
      >
        Insert Blank Page
      </button>
    </div>

    <!-- Generate PDF Button -->
    <div class="text-center mt-6">
      <button
        id="generatePdfButton"
        class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700"
      >
        Generate PDF
      </button>
    </div>

    <!-- Download Link -->
    <div class="text-center mt-6 hidden" id="downloadLinkContainer">
      <h3 class="text-xl font-semibold text-green-600 mb-2">
        Your PDF is ready!
      </h3>
      <a
        id="downloadLink"
        href="#"
        target="_blank"
        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
        >Download PDF</a
      >
    </div>
  </section>

  <!-- Footer -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('nav-links');
    menuToggle?.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>

  <!-- JS Script -->
   
<!-- Include SortableJS before your custom script -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="{{ url_for('static', filename='js/add_blank_page.js') }}"></script></body>
</html>
