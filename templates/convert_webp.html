<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearCutHub - WEBP to PNG/JPG Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/convert_webp.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ClearCut Logo" class="website-logo">
    ClearCutHub
  </div>
  <ul class="nav-links" id="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/background-remove">Background Change</a></li>
    <li><a href="/resize-image">Image Resize</a></li>
    <li><a href="/#all-tools">All Convert Tools</a></li>
    <li><a href="/#Contact">Contact</a></li>

  </ul>
  <div class="menu-toggle" id="menuToggle">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</nav>

<!-- Converter Section -->
<section id="convert" class="max-w-3xl mx-auto px-6 py-12">
  <h2 class="text-3xl font-semibold text-center text-indigo-600 mb-8">WEBP to PNG/JPG Converter</h2>

  <form id="convertForm" action="/convert-webp" method="POST" enctype="multipart/form-data">

    <!-- Output Format -->
    <div>
      <label for="convertFormat" class="block mb-2 text-gray-700 font-medium">Select Output Format:</label>
      <select name="convertFormat" id="convertFormat" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">-- Select --</option>
        <option value="png">WEBP to PNG</option>
        <option value="jpg">WEBP to JPG</option>
      </select>
    </div>

    <!-- File Upload -->
    <div>
      <label for="file_input" class="block mb-2 text-gray-700 font-medium">Upload WEBP File:</label>
      <div id="dropArea" class="w-full p-5 border-2 border-dashed border-indigo-400 rounded-lg text-center cursor-pointer transition hover:bg-indigo-50">
        <p class="text-gray-600">Drag & drop your WEBP files here, or click to select</p>
        <input type="file" id="file_input" name="files" accept=".webp" multiple hidden>
      </div>
      <ul id="fileList" class="mt-3 text-sm text-gray-700 space-y-1"></ul>

      <!-- Preview Section -->
      <div id="previewSection" class="mt-4 grid grid-cols-3 gap-4" style="display: none;">
        <!-- Previews will appear here -->
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-md hover:bg-indigo-700 transition">
      Convert Now
    </button>

    <!-- Spinner -->
    <div id="spinner" class="flex justify-center mt-4 hidden">
      <svg class="animate-spin h-6 w-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
    </div>
  </form>

  <!-- Download Section -->
  <div id="downloadSection" class="hidden mt-6 text-center">
    <h3 class="text-green-600 text-xl font-semibold mb-2">✅ Conversion Successful!</h3>
    <a id="downloadLink" href="#" download class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md shadow inline-block">
      Download Converted File
    </a>
  </div>
</section>

<!-- Footer -->

<!-- Navigation Toggle Script -->
<script>
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('nav-links');
  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });
</script>

<!-- External JS -->
<script src="{{ url_for('static', filename='js/convert_webp.js') }}"></script>

</body>
</html>
