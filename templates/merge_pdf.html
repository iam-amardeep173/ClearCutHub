<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearCutHub - Merge PDF Files</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind for fast design -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- External CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/merge_pdf.css') }}">
  
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">
        <img src="/static/images/logo.png" alt="ClearCut Logo" class="website-logo">
        ClearCutHub
    </div>
    <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/background-remove">Background Change</a></li>
        <li><a href="/resize-image">Photo Compress</a></li>
        <li><a href="/#all-tools">All Convert Tools</a></li>
        <li><a href="/#Contact">Contact</a></li>
    </ul>

    <!-- Hamburger Menu -->
    <div class="menu-toggle" id="mobile-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>
</nav>

<!-- Upload Section -->
<section id="upload" class="container mx-auto px-6 py-12">
  <div class="bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-3xl font-bold text-center mb-6 text-indigo-600">Merge Multiple PDFs</h2>

      <form id="mergePdfForm" enctype="multipart/form-data">
          <label class="block text-gray-700 mb-2">Upload PDF Files to Merge:</label>

          <!-- ✅ Removed 'required' to prevent native validation -->
          <input type="file" name="pdf_files" id="pdf_files" accept=".pdf" multiple 
                 class="block w-full border border-gray-300 p-3 mb-6 rounded">

          <!-- Drag-and-drop area + file list -->
          <div id="dropzone" class="border-2 border-dashed border-indigo-400 p-4 text-center text-gray-600 mb-4 rounded cursor-pointer">
              Drag and drop PDF files here
          </div>
          <ul id="fileList" class="space-y-2"></ul>
          <div id="filePreview" class="grid grid-cols-2 gap-2 mb-4"></div>

          <button type="submit" class="bg-indigo-600 w-full py-3 text-white font-bold rounded hover:bg-indigo-700">
              Merge PDFs
          </button>

          <div id="spinner" class="flex justify-center mt-4 hidden">
              <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
          </div>
      </form>

      <div id="resultContainer" class="mt-8 hidden text-center">
          <h2 class="text-2xl font-semibold mb-4 text-green-600">Download ready!</h2>
          <a id="downloadLink" class="block mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded" target="_blank">
              Click here if download didn’t start
          </a>
      </div>        
  </div>
</section>

<script>
  const menuToggle = document.getElementById('mobile-menu');  // Corrected ID here
  const navLinks = document.getElementById('nav-links');

  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });

  // You can implement the drag and drop here
  const dropzone = document.getElementById('dropzone');
  dropzone.addEventListener('dragover', (event) => {
    event.preventDefault();
  });

  dropzone.addEventListener('drop', (event) => {
    event.preventDefault();
    const files = event.dataTransfer.files;
    document.getElementById('pdf_files').files = files;
    updateFileList(files); // Function to display files in the list
  });

  function updateFileList(files) {
    const fileList = document.getElementById('fileList');
    fileList.innerHTML = '';
    for (const file of files) {
      const li = document.createElement('li');
      li.textContent = file.name;
      fileList.appendChild(li);
    }
  }
</script>

<!-- External JS -->
<script src="{{ url_for('static', filename='js/merge_pdf.js') }}"></script>

</body>
</html>
